{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block main %}
<div class="col-12 col-lg-8 mx-auto">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-3">
                <i class="bi bi-credit-card text-primary me-2"></i>Checkout
            </h4>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-grid gap-2 d-sm-flex justify-content-sm-end mt-3">
                    <a href="{% url 'cart' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back to Cart
                    </a>
                    <button type="submit" class="btn btn-dark">
                        Place Order<i class="bi bi-check2-circle ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
